name: Build and release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repository of the app source (empty = this repository). e.g. FongMi/TV"
        required: false
        default: ""
      source_ref:
        description: "Commit, branch or tag of the app source (empty = the selected branch / default branch). e.g. 4afc4473e22a7ed3d98ee12233e0c2a490061000 (full SHA) for FongMi/TV 5.6.3"
        required: false
        default: ""
      compat:
        description: "Compatibility shims for the public FongMi/media AARs"
        type: choice
        options:
          - none
          - tv-5.6.3
        default: none
      tag:
        description: "Release tag (leave empty to use v<versionName> from app/build.gradle)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Release in this repository that holds the git-ignored native AARs (app/libs/lib-*.aar) as assets.
  LIBS_RELEASE_TAG: build-libs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.source_repo == '' && inputs.source_ref == '' && github.ref || '' }}
          fetch-depth: 0

      - name: Select source revision
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_REF" ]; then
            # Commits dropped from every branch (e.g. after a history rewrite) are not cloned,
            # but GitHub still serves them when fetched by full SHA.
            if ! git checkout --force "$SOURCE_REF" 2>/dev/null; then
              git fetch --depth=1 origin "$SOURCE_REF"
              git checkout --force FETCH_HEAD
            fi
          fi
          git log -1 --format='Building %H %cs %s'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out this repository (patch scripts)
        uses: actions/checkout@v4
        with:
          path: .ci

      - name: Inject compatibility shims
        if: ${{ inputs.compat == 'tv-5.6.3' }}
        run: |
          set -euo pipefail
          python3 .ci/.github/compat/inject_tv_5.6.3.py
          n=$(find app/src/main/java/androidx -name '*.java' | wc -l)
          [ "$n" -eq 11 ] || { echo "::error::expected 11 injected files, found $n"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Chaquopy (the :chaquo module in older app versions) needs Python 3.10 on the build machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download native AARs
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_LIBS_URL: ${{ secrets.NATIVE_LIBS_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libs"
          if [ -n "${NATIVE_LIBS_URL:-}" ]; then
            curl -fsSL "$NATIVE_LIBS_URL" -o "$RUNNER_TEMP/libs/libs.zip"
          else
            gh release download "$LIBS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/libs"
          fi
          for z in "$RUNNER_TEMP"/libs/*.zip; do [ -e "$z" ] && unzip -o -j "$z" '*.aar' -d "$RUNNER_TEMP/libs"; done
          cp "$RUNNER_TEMP"/libs/lib-*.aar app/libs/
          for f in lib-mpvplayer-release.aar lib-decoder-ffmpeg-release.aar; do
            [ -f "app/libs/$f" ] || { echo "::error::app/libs/$f is missing"; exit 1; }
          done
          ls -l app/libs

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TEMP_SIGNING=false" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set; signing with a throwaway key. Set KEYSTORE_BASE64, KEY_ALIAS and STORE_PASSWORD for real releases."
            KEY_ALIAS=temp
            STORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
              -dname "CN=Temporary CI key" > /dev/null
            echo "TEMP_SIGNING=true" >> "$GITHUB_ENV"
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
          } > local.properties

      - name: Build release APKs
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^\s*versionName\s+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${version}"
          fi
          mkdir -p dist
          find app/build/outputs/apk -path '*/release/*.apk' -exec cp {} dist/ \;
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::No APK produced"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.source_repo }}" ] || [ "${{ inputs.source_repo }}" = "$GITHUB_REPOSITORY" ]; then
            echo "target=${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "Source: ${{ inputs.source_repo || github.repository }}@${{ steps.source.outputs.sha }}"
            echo "Compatibility shims: ${{ inputs.compat || 'none' }}"
            echo "Media AARs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$LIBS_RELEASE_TAG"
            if [ "${TEMP_SIGNING:-false}" = "true" ]; then echo "Signed with a throwaway CI key."; fi
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.collect.outputs.tag }}
          path: dist/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: ${{ steps.collect.outputs.tag }}
          target_commitish: ${{ steps.collect.outputs.target }}
          body_path: notes.md
          prerelease: ${{ inputs.prerelease || env.TEMP_SIGNING == 'true' }}
          files: dist/*.apk
